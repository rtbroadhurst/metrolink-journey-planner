name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache JUnit download
        uses: actions/cache@v4
        with:
          path: lib
          key: junit-cache-${{ hashFiles('run-tests.sh', '**/*.java') }}
          restore-keys: |
            junit-cache-

      - name: Run tests
        run: bash run-tests.sh
